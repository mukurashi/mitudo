            --success: #55cc88;

        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            overflow: hidden;

            width: 100vw;
            height: -webkit-fill-available;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: pan-x pan-y pinch-zoom;
            position: fixed;
            top: 0;
            left: 0;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
        }

        /* --- 情報パネル --- */
        #info-panel {
            position: fixed;
            top: max(12px, env(safe-area-inset-top, 12px));
            left: max(10px, env(safe-area-inset-left, 10px));
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 14px 18px;
            color: var(--text);
            min-width: 230px;
            max-width: calc(100vw - 20px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
            transition: all 0.2s ease;
        }
        #info-panel h2 {
            font-size: clamp(0.85rem, 2.5vw, 1.1rem);
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: 0.04em;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #info-panel h2 .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
            flex-shrink: 0;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(85, 204, 136, 0.7);
            }
            50% {
                box-shadow: 0 0 0 14px rgba(85, 204, 136, 0);
            }
        }
        #info-panel .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 5px 0;
            font-size: clamp(0.7rem, 2vw, 0.88rem);
            gap: 12px;
        }
        #info-panel .stat-label {
            color: #aaa;
            font-size: clamp(0.65rem, 1.8vw, 0.78rem);
            flex-shrink: 0;
            white-space: nowrap;
        }
        #info-panel .stat-value {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', 'Menlo', monospace;
            color: #fff;
            font-size: clamp(0.8rem, 2.2vw, 1.05rem);
            text-align: right;
            letter-spacing: -0.02em;
        }
        #info-panel .stat-value.high {
            color: #ff8877;
        }
        #info-panel .stat-value.low {
            color: #77dd88;
        }
        #info-panel .bar-container {
            margin-top: 10px;
            height: 7px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }
        #info-panel .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 1.2s ease, background 1.2s ease;
            background: linear-gradient(90deg, #44cc66, #ff4466);
        }

        /* --- 凡例 --- */
        #legend {
            position: fixed;
            bottom: max(20px, calc(env(safe-area-inset-bottom, 20px) + 8px));
            left: max(10px, env(safe-area-inset-left, 10px));
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px 16px;
            color: var(--text);
            font-size: clamp(0.65rem, 1.8vw, 0.76rem);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            max-width: calc(100vw - 20px);
        }
        #legend .gradient-bar {
            width: clamp(130px, 40vw, 200px);
            height: 12px;
            border-radius: 6px;
            margin: 6px 0;
            background: linear-gradient(90deg, #33cc55, #77cc44, #cccc33, #dd8822, #dd4422, #cc1133);
        }
        #legend .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: clamp(0.6rem, 1.6vw, 0.7rem);
            color: #aaa;
            width: 100%;
        }

        #status-badge {
            position: fixed;
            top: max(12px, env(safe-area-inset-top, 12px));
            right: max(10px, env(safe-area-inset-right, 10px));
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 9px 15px;
            color: #ccc;
            font-size: clamp(0.7rem, 2vw, 0.82rem);

            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }
        #status-badge .indicator {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse-dot 2s infinite;
            flex-shrink: 0;
        }
        #status-badge .indicator.warning {
            background: #ffaa33;
            animation: pulse-dot-warn 1.5s infinite;
        }
        @keyframes pulse-dot-warn {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 170, 51, 0.7);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(255, 170, 51, 0);
            }
        }
        #countdown {
            font-weight: 700;
            color: #fff;
            min-width: 16px;
            text-align: center;

            font-family: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;

        #touch-hint {

            bottom: max(90px, calc(env(safe-area-inset-bottom, 90px) + 60px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 8px 16px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.7rem;
            pointer-events: none;
            transition: opacity 1s ease;
            opacity: 0;
        }
        #touch-hint.visible {
            opacity: 1;
        }

        @media (max-width: 600px) {

                top: 8px;
                left: 6px;
                padding: 10px 14px;
                min-width: 170px;
                border-radius: 14px;

            #info-panel h2 {
                font-size: 0.82rem;
                gap: 5px;
            }
            #info-panel h2 .dot {
                width: 7px;
                height: 7px;
            }
            #info-panel .stat-row {
                font-size: 0.7rem;
                margin: 3px 0;
            }
            #info-panel .bar-container {
                height: 5px;
                margin-top: 6px;
            }
            #legend {

                left: 6px;
                padding: 8px 12px;
                border-radius: 12px;

            #legend .gradient-bar {

            }
            #status-badge {

                border-radius: 20px;
                gap: 5px;
            }
            #status-badge .indicator {
                width: 7px;
                height: 7px;
            }
        }
        @media (max-width: 380px) {
            #info-panel {
                padding: 8px 10px;
                min-width: 140px;
                border-radius: 10px;
            }
            #legend {
                padding: 6px 10px;
            }
            #legend .gradient-bar {
                width: 100px;
                height: 8px;
            }
        }
