<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>統合人流予測 3D + 地図 (Geoapify)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #0a0a14;
            --panel-bg: rgba(10, 10, 30, 0.92);
            --text: #e0e0e0;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:var(--bg); overflow:hidden;
            font-family:'Segoe UI','Inter',sans-serif;
            height:100vh;width:100vw;position:fixed;top:0;left:0;
            user-select:none;-webkit-user-select:none;
            -webkit-tap-highlight-color:transparent;
            touch-action:pan-x pan-y pinch-zoom;
        }
        #canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;}
        #info-panel{
            position:fixed;top:12px;left:10px;z-index:10;
            background:var(--panel-bg);backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.15);border-radius:14px;
            padding:12px 14px;color:var(--text);font-size:0.8rem;
            min-width:240px;max-width:calc(100vw - 20px);
            box-shadow:0 8px 32px rgba(0,0,0,0.5);
        }
        #info-panel h2{font-size:0.95rem;margin-bottom:6px;color:#fff;}
        .stat-row{display:flex;justify-content:space-between;margin:3px 0;}
        .stat-label{color:#aaa;font-size:0.7rem;}
        .stat-value{font-weight:600;color:#fff;font-family:monospace;}
        .bar-container{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin-top:6px;overflow:hidden;}
        .bar-fill{height:100%;border-radius:3px;transition:width 1s;background:linear-gradient(90deg,#44cc66,#ff4466);}

        #legend{
            position:fixed;bottom:20px;left:10px;z-index:10;
            background:var(--panel-bg);backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.15);border-radius:12px;
            padding:8px 14px;color:var(--text);font-size:0.7rem;
            box-shadow:0 8px 32px rgba(0,0,0,0.5);
        }
        #legend .gradient-bar{width:150px;height:10px;border-radius:5px;margin:4px 0;background:linear-gradient(90deg,#33cc55,#cccc33,#dd8822,#cc1133);}
        .legend-labels{display:flex;justify-content:space-between;color:#aaa;font-size:0.6rem;}

        #status-badge{
            position:fixed;top:12px;right:10px;z-index:10;
            background:var(--panel-bg);backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.15);border-radius:24px;
            padding:8px 14px;color:#ccc;font-size:0.75rem;
            box-shadow:0 8px 32px rgba(0,0,0,0.5);
        }
        .indicator{width:8px;height:8px;border-radius:50%;background:#55cc88;display:inline-block;margin-right:6px;animation:pulse 2s infinite;}
        .indicator.warning{background:#ffaa33;animation:pulse-warn 1.5s infinite;}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(85,204,136,0.7)}50%{box-shadow:0 0 0 10px rgba(85,204,136,0)}}
        @keyframes pulse-warn{0%,100%{box-shadow:0 0 0 0 rgba(255,170,51,0.7)}50%{box-shadow:0 0 0 10px rgba(255,170,51,0)}}

        #minimap-container{
            position:fixed;bottom:20px;right:10px;z-index:10;
            width:180px;height:180px;border-radius:12px;overflow:hidden;
            border:2px solid rgba(255,255,255,0.3);
            box-shadow:0 8px 32px rgba(0,0,0,0.6);
        }
        #minimap{width:100%;height:100%;}
        @media (max-width:600px){
            #info-panel{font-size:0.7rem;padding:8px 10px;min-width:180px;}
            #legend{bottom:10px;padding:5px 10px;}
            #minimap-container{width:120px;height:120px;bottom:10px;}
        }
        #api-key-panel{
            position:fixed;bottom:20px;left:200px;z-index:20;
            background:var(--panel-bg);padding:8px;border-radius:8px;
            color:white;font-size:0.6rem;display:flex;gap:5px;align-items:center;
        }
        #api-key-input{width:160px;padding:2px;border-radius:4px;border:1px solid #555;background:#222;color:white;}
        button{padding:2px 6px;border-radius:4px;background:#44a;color:white;border:none;cursor:pointer;}
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="info-panel">
        <h2>📊 統合人流予測 (Geoapify)</h2>
        <div class="stat-row"><span class="stat-label">📍 位置</span><span class="stat-value" id="latlon">取得中</span></div>
        <div class="stat-row"><span class="stat-label">🕒 曜日/時間</span><span class="stat-value" id="daytime">--</span></div>
        <div class="stat-row"><span class="stat-label">🌤 天気</span><span class="stat-value" id="weather">--</span></div>
        <div class="stat-row"><span class="stat-label">🚦 交通量(観測点)</span><span class="stat-value" id="traffic">--</span></div>
        <div class="stat-row"><span class="stat-label">🎉 イベント施設</span><span class="stat-value" id="event">--</span></div>
        <div class="stat-row"><span class="stat-label">📰 ニュース</span><span class="stat-value" id="news">--</span></div>
        <div class="stat-row" style="margin-top:4px;border-top:1px solid rgba(255,255,255,0.2);padding-top:4px;">
            <span class="stat-label">📈 統合スコア</span>
            <span class="stat-value" id="score-val">--</span>
        </div>
        <div class="bar-container"><div class="bar-fill" id="density-bar" style="width:0%;"></div></div>
    </div>

    <div id="legend">
        <span style="font-weight:600;">混雑度 (統合スコア)</span>
        <div class="gradient-bar"></div>
        <div class="legend-labels"><span>低</span><span>中</span><span>高</span></div>
    </div>

    <div id="status-badge">
        <span class="indicator" id="status-indicator"></span>
        <span>次回更新 <span id="countdown">28:48</span></span>
    </div>

    <div id="minimap-container">
        <div id="minimap"></div>
    </div>

    <div id="api-key-panel">
        <span>🔑 Geoapify APIキー</span>
        <input type="text" id="api-key-input" placeholder="キーを入力して有効化">
        <button id="api-key-apply">適用</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 設定
        const UPDATE_INTERVAL = 28.8 * 60 * 1000; // 28.8分 (1728000ミリ秒)
        const RADIUS_M = 1000;
        const DENSITY_MAX = 100;
        const FALLBACK_GRID_RES = 30;
        const MAX_POINTS = 300;
        const isMobile = window.innerWidth < 768;

        // DOM
        const container = document.getElementById('canvas-container');
        const elLatLon = document.getElementById('latlon');
        const elDaytime = document.getElementById('daytime');
        const elWeather = document.getElementById('weather');
        const elTraffic = document.getElementById('traffic');
        const elEvent = document.getElementById('event');
        const elNews = document.getElementById('news');
        const elScore = document.getElementById('score-val');
        const elDensityBar = document.getElementById('density-bar');
        const elCountdown = document.getElementById('countdown');
        const elStatusIndicator = document.getElementById('status-indicator');
        const apiKeyInput = document.getElementById('api-key-input');
        const apiKeyApply = document.getElementById('api-key-apply');

        let currentLat = 35.6812, currentLon = 139.7671;
        let geoapifyKey = ''; // Geoapify APIキー

        // 位置情報
        function getPosition() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) return reject(new Error('非対応'));
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true, timeout: 8000, maximumAge: 30000
                });
            });
        }

        // 因子1: 曜日・時間帯
        function getDayTimeFactor() {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            let factor = 0.5;
            if (day >= 1 && day <= 5) {
                if (hour >= 7 && hour <= 9) factor = 0.95;
                else if (hour >= 17 && hour <= 19) factor = 0.9;
                else if (hour >= 10 && hour <= 16) factor = 0.6;
                else if (hour >= 20 && hour <= 23) factor = 0.7;
                else factor = 0.2;
            } else {
                if (hour >= 10 && hour <= 18) factor = 0.85;
                else if (hour >= 19 && hour <= 22) factor = 0.75;
                else factor = 0.35;
            }
            const days = ['日','月','火','水','木','金','土'];
            elDaytime.textContent = `${days[day]}曜 ${hour}時 (${factor.toFixed(2)})`;
            return factor;
        }

        // 因子2: 天気 (Open-Meteo)
        async function getWeatherFactor(lat, lon) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
                const res = await fetch(url);
                const data = await res.json();
                const code = data.current_weather.weathercode;
                const temp = data.current_weather.temperature;
                let factor = 0.8;
                let desc = '';
                if (code === 0) { factor = 1.0; desc = '快晴'; }
                else if (code <= 3) { factor = 0.9; desc = '曇り'; }
                else if (code <= 48) { factor = 0.7; desc = '霧'; }
                else if (code <= 67) { factor = 0.4; desc = '雨'; }
                else if (code <= 77) { factor = 0.25; desc = '雪'; }
                else { factor = 0.6; desc = '他'; }
                if (temp < 5) factor *= 0.7;
                else if (temp > 35) factor *= 0.8;
                elWeather.textContent = `${desc} ${temp}℃ (${factor.toFixed(2)})`;
                return factor;
            } catch (e) {
                elWeather.textContent = '取得失敗';
                return 0.5;
            }
        }

        // 因子3: 交通量 (xROAD)
        async function fetchTrafficPoints(lat, lng) {
            const dLat = 1.0 / 111.32;
            const dLon = 1.0 / (111.32 * Math.cos(lat * Math.PI/180));
            const bbox = [lng-dLon, lat-dLat, lng+dLon, lat+dLat].map(v=>v.toFixed(6)).join(',');
            const now = new Date();
            const ft = new Date(now.getTime() - 25*60000);
            const pad = n=>String(n).padStart(2,'0');
            const y=ft.getFullYear(), m=pad(ft.getMonth()+1), d=pad(ft.getDate()), h=pad(ft.getHours()), min=pad(Math.floor(ft.getMinutes()/5)*5);
            const timeCode = `${y}${m}${d}${h}${min}`;
            const timeCodeEnd = `${y}${m}${d}${h}${pad(parseInt(min)+5)}`;
            const url = `https://api.jartic-open-traffic.org/geoserver?service=WFS&version=2.0.0&request=GetFeature&typeNames=t_travospublic_measure_5m&srsName=EPSG:4326&outputFormat=application/json&cql_filter=BBOX(ジオメトリ,${bbox},'EPSG:4326') AND 時間コード>=${timeCode} AND 時間コード<=${timeCodeEnd} AND 道路種別='3'`;
            const res = await fetch(url);
            if (!res.ok) return [];
            const data = await res.json();
            if (!data.features) return [];
            return data.features.map(f=>{
                const p = f.properties;
                const vol = Math.min(parseInt(p['上り・小型交通量']||0) + parseInt(p['下り・小型交通量']||0), DENSITY_MAX);
                return { lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], volume: vol };
            });
        }

        async function getTrafficFactor(lat, lon) {
            try {
                const points = await fetchTrafficPoints(lat, lon);
                if (points.length === 0) {
                    elTraffic.textContent = '観測点なし';
                    return { factor: 0.5, points: [] };
                }
                const avg = points.reduce((s,p)=>s+p.volume,0)/points.length;
                const factor = Math.min(1, avg / DENSITY_MAX);
                elTraffic.textContent = `${points.length}地点 平均${Math.round(avg)}台/5分 (${factor.toFixed(2)})`;
                return { factor, points };
            } catch (e) {
                elTraffic.textContent = 'APIエラー';
                return { factor: 0.5, points: [] };
            }
        }

        // 因子4: イベント (Geoapify Places API)
        async function getEventFactor(lat, lon) {
            if (!geoapifyKey) {
                elEvent.textContent = 'キー未設定';
                return 0.3;
            }
            try {
                // イベント会場とみなせるカテゴリ: コンベンションセンター、スタジアム、劇場
                const categories = 'building.convention_center,entertainment.stadium,entertainment.theatre';
                const radius = 1000;
                const url = `https://api.geoapify.com/v2/places?categories=${encodeURIComponent(categories)}&filter=circle:${lon},${lat},${radius}&limit=50&apiKey=${geoapifyKey}`;
                const res = await fetch(url);
                const data = await res.json();
                const count = data.features ? data.features.length : 0;
                const factor = Math.min(1, count * 0.25 + 0.3);
                elEvent.textContent = `${count}施設 (${factor.toFixed(2)})`;
                return factor;
            } catch (e) {
                elEvent.textContent = 'エラー';
                return 0.3;
            }
        }

        // 因子5: ニュース (GDELT)
        async function getNewsFactor() {
            try {
                const url = `https://api.gdeltproject.org/api/v2/doc/doc?query=japan&mode=artlist&format=json&timespan=24h&maxrecords=20`;
                const res = await fetch(url);
                const data = await res.json();
                const count = data.articles ? data.articles.length : 0;
                const factor = Math.min(1, count * 0.1 + 0.2);
                elNews.textContent = `${count}記事 (${factor.toFixed(2)})`;
                return factor;
            } catch (e) {
                elNews.textContent = '取得失敗';
                return 0.4;
            }
        }

        // 統合スコア計算
        function computeScore(day, weather, traffic, event, news) {
            return day*0.25 + weather*0.2 + traffic*0.35 + event*0.1 + news*0.1;
        }

        // --- ミニマップ (Leaflet) ---
        let minimap, userMarker, trafficLayer;
        function initMinimap() {
            minimap = L.map('minimap', { attributionControl:false, zoomControl:false, dragging:false }).setView([currentLat, currentLon], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(minimap);
            userMarker = L.circleMarker([currentLat, currentLon], { radius:6, color:'red', fillColor:'#f03', fillOpacity:0.8 }).addTo(minimap);
            trafficLayer = L.layerGroup().addTo(minimap);
        }
        function updateMinimap(lat, lon, points) {
            if (!minimap) initMinimap();
            minimap.setView([lat, lon], 14);
            userMarker.setLatLng([lat, lon]);
            trafficLayer.clearLayers();
            points.forEach(p => {
                L.circleMarker([p.lat, p.lon], { radius:4, color:'#3388ff', fillColor:'#3388ff', fillOpacity:0.7 })
                 .bindPopup(`交通量: ${p.volume}台/5分`).addTo(trafficLayer);
            });
        }

        // --- Three.js シーン ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a18);
        scene.fog = new THREE.Fog(0x0a0a18, 600, 3500);
        const camera = new THREE.PerspectiveCamera(isMobile?55:50, container.clientWidth/container.clientHeight, 10, 6000);
        camera.position.set(1100,850,1300); camera.lookAt(0,0,0);
        const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0,80,0); controls.enableDamping=true; controls.dampingFactor=0.15;
        controls.minDistance=150; controls.maxDistance=3500; controls.update();

        scene.add(new THREE.AmbientLight(0x334466, 2.5));
        scene.add(new THREE.HemisphereLight(0x8899cc, 0x223344, 2));
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(RADIUS_M*2.4,RADIUS_M*2.4),
            new THREE.MeshStandardMaterial({color:0x1a1a3a, roughness:0.85, metalness:0.1, transparent:true, opacity:0.5}));
        ground.rotation.x=-Math.PI/2; ground.position.y=-15; scene.add(ground);
        const gridHelper = new THREE.PolarGridHelper(RADIUS_M,32,16,64,0x334466,0x223355);
        gridHelper.position.y=-14; scene.add(gridHelper);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(RADIUS_M,6,16,100),
            new THREE.MeshStandardMaterial({color:0x4488cc, roughness:0.4, metalness:0.6, emissive:0x112233}));
        ring.rotation.x=-Math.PI/2; ring.position.y=-12; scene.add(ring);

        const markerGroup = new THREE.Group();
        markerGroup.add(new THREE.Mesh(new THREE.SphereGeometry(20,32,32),
            new THREE.MeshStandardMaterial({color:0xff4466, roughness:0.2, metalness:0.3, emissive:0x441111})));
        const pulse = new THREE.Mesh(new THREE.TorusGeometry(26,4,16,48),
            new THREE.MeshStandardMaterial({color:0xff6677, roughness:0.3, metalness:0.4, emissive:0x330000, transparent:true, opacity:0.7}));
        pulse.rotation.x=-Math.PI/2; pulse.name='pulseRing'; markerGroup.add(pulse);
        markerGroup.position.y=0; scene.add(markerGroup);

        // 点群バッファ
        const pointGeo = new THREE.BufferGeometry();
        const posArr = new Float32Array(MAX_POINTS*3);
        const colArr = new Float32Array(MAX_POINTS*3);
        pointGeo.setAttribute('position', new THREE.BufferAttribute(posArr,3));
        pointGeo.setAttribute('color', new THREE.BufferAttribute(colArr,3));
        pointGeo.setDrawRange(0,0);
        const spriteTex = (()=>{
            const c=document.createElement('canvas'); c.width=64;c.height=64;
            const ctx=c.getContext('2d'); const g=ctx.createRadialGradient(32,32,0,32,32,32);
            g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.3,'rgba(255,255,255,0.6)'); g.addColorStop(1,'rgba(255,255,255,0)');
            ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
            return new THREE.CanvasTexture(c);
        })();
        const pointMat = new THREE.PointsMaterial({size:isMobile?20:28, map:spriteTex, vertexColors:true, blending:THREE.AdditiveBlending, depthWrite:false, depthTest:true, transparent:true, opacity:0.85});
        const pointCloud = new THREE.Points(pointGeo, pointMat);
        scene.add(pointCloud);

        function densityToColor(d){ const t=Math.min(1,d/DENSITY_MAX); return new THREE.Color().setHSL((1-t)*0.33,0.8,0.4+t*0.4); }
        function densityToHeight(d){ const t=Math.min(1,d/DENSITY_MAX); return 8 + Math.pow(t,1.5)*300; }

        function updatePointsFromReal(points) {
            const count = Math.min(points.length, MAX_POINTS);
            for(let i=0;i<count;i++){
                const p = points[i];
                const dx = (p.lon - currentLon)*111320*Math.cos(currentLat*Math.PI/180);
                const dy = (p.lat - currentLat)*111320;
                const h = densityToHeight(p.volume);
                const col = densityToColor(p.volume);
                posArr[i*3]=dx; posArr[i*3+1]=h/2; posArr[i*3+2]=dy;
                colArr[i*3]=col.r; colArr[i*3+1]=col.g; colArr[i*3+2]=col.b;
            }
            for(let i=count;i<MAX_POINTS;i++) posArr[i*3+1] = -999;
            pointGeo.attributes.position.needsUpdate = true;
            pointGeo.attributes.color.needsUpdate = true;
            pointGeo.setDrawRange(0, count);
            pointGeo.computeBoundingSphere();
            return count;
        }

        function generateSimGrid(score) {
            const cells = [];
            const half = (FALLBACK_GRID_RES-1)/2;
            const spacing = (RADIUS_M*2)/(FALLBACK_GRID_RES-1);
            for(let r=0;r<FALLBACK_GRID_RES;r++){
                for(let c=0;c<FALLBACK_GRID_RES;c++){
                    const x = (c-half)*spacing, z = (r-half)*spacing;
                    const dist = Math.sqrt(x*x+z*z)/RADIUS_M;
                    const density = DENSITY_MAX * (score * Math.exp(-dist*dist*2.5) + 0.1*Math.random());
                    cells.push({ relX:x, relZ:z, density: Math.min(DENSITY_MAX, density) });
                }
            }
            return cells;
        }

        function updatePointsFromSim(cells) {
            const count = Math.min(cells.length, MAX_POINTS);
            for(let i=0;i<count;i++){
                const c = cells[i], h = densityToHeight(c.density), col = densityToColor(c.density);
                posArr[i*3]=c.relX; posArr[i*3+1]=h/2; posArr[i*3+2]=c.relZ;
                colArr[i*3]=col.r; colArr[i*3+1]=col.g; colArr[i*3+2]=col.b;
            }
            for(let i=count;i<MAX_POINTS;i++) posArr[i*3+1] = -999;
            pointGeo.attributes.position.needsUpdate = true;
            pointGeo.attributes.color.needsUpdate = true;
            pointGeo.setDrawRange(0, count);
            pointGeo.computeBoundingSphere();
            return count;
        }

        // メイン更新処理
        let countdownSeconds = UPDATE_INTERVAL / 1000; // 1728
        function formatCountdown(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${String(s).padStart(2,'0')}`;
        }

        async function refreshData() {
            try {
                const pos = await getPosition();
                currentLat = pos.coords.latitude;
                currentLon = pos.coords.longitude;
            } catch(e) {}
            elLatLon.textContent = `${currentLat.toFixed(5)}, ${currentLon.toFixed(5)}`;

            const dayFactor = getDayTimeFactor();
            const [weatherFactor, trafficRes, eventFactor, newsFactor] = await Promise.all([
                getWeatherFactor(currentLat, currentLon),
                getTrafficFactor(currentLat, currentLon),
                getEventFactor(currentLat, currentLon),
                getNewsFactor()
            ]);
            const trafficFactor = trafficRes.factor;
            const points = trafficRes.points;

            const score = computeScore(dayFactor, weatherFactor, trafficFactor, eventFactor, newsFactor);
            elScore.textContent = score.toFixed(2);
            elDensityBar.style.width = (score*100)+'%';

            if (points.length > 0) {
                updatePointsFromReal(points);
            } else {
                const simCells = generateSimGrid(score);
                updatePointsFromSim(simCells);
            }
            updateMinimap(currentLat, currentLon, points);
            console.log(`✅ 更新完了: スコア=${score.toFixed(2)}`);
        }

        let updateTimer, countdownInterval;
        function startAutoUpdate() {
            // 初回即実行
            refreshData().then(() => {
                countdownSeconds = UPDATE_INTERVAL / 1000;
                elCountdown.textContent = formatCountdown(countdownSeconds);
                elStatusIndicator.className = 'indicator';
            });
            // 定期更新
            updateTimer = setInterval(async () => {
                elStatusIndicator.className = 'indicator warning';
                await refreshData();
                countdownSeconds = UPDATE_INTERVAL / 1000; // リセット
                elCountdown.textContent = formatCountdown(countdownSeconds);
                elStatusIndicator.className = 'indicator';
            }, UPDATE_INTERVAL);
            // カウントダウン (毎秒)
            countdownInterval = setInterval(() => {
                countdownSeconds = Math.max(0, countdownSeconds - 1);
                elCountdown.textContent = formatCountdown(countdownSeconds);
            }, 1000);
        }

        // アニメーション
        function animate(ts){
            requestAnimationFrame(animate);
            controls.update();
            const p = markerGroup.getObjectByName('pulseRing');
            if(p){ const s=1+Math.sin(ts*0.003)*0.4; p.scale.setScalar(s); p.material.opacity=0.3+Math.sin(ts*0.003)*0.3; }
            markerGroup.position.y = Math.sin(ts*0.002)*6;
            renderer.render(scene, camera);
        }

        // リサイズ
        window.addEventListener('resize', ()=>{
            camera.aspect = container.clientWidth/container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            pointMat.size = container.clientWidth<400?18:container.clientWidth<600?22:30;
        });

        // Geoapify APIキー設定
        apiKeyApply.addEventListener('click', ()=>{
            geoapifyKey = apiKeyInput.value.trim();
            if (geoapifyKey) {
                elEvent.textContent = 'キー有効 (次回更新時に反映)';
            }
        });

        // キー操作
        window.addEventListener('keydown', e=>{
            if(e.key==='r'){ camera.position.set(1100,850,1300); controls.target.set(0,80,0); controls.update(); }
            else if(e.key==='t'){ camera.position.set(0,1700,15); controls.target.set(0,0,0); controls.update(); }
            else if(e.key==='f'){ refreshData(); countdownSeconds=UPDATE_INTERVAL/1000; elCountdown.textContent=formatCountdown(countdownSeconds); }
        });

        // 起動
        console.log('🚀 統合人流予測 28.8分更新 | Geoapifyイベント機能');
        startAutoUpdate();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
