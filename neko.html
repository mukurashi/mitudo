<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>統合リアルタイム人流予測 3Dマップ (安定版)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #0a0a14;
            --panel-bg: rgba(10, 10, 30, 0.92);
            --text: #e0e0e0;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:var(--bg); overflow:hidden;
            font-family:'Segoe UI','Inter',sans-serif;
            height:100vh;width:100vw;
            position:fixed;top:0;left:0;
            user-select:none;-webkit-user-select:none;
            -webkit-tap-highlight-color:transparent;
            touch-action:pan-x pan-y pinch-zoom;
        }
        #canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;}
        #info-panel{
            position:fixed;top:12px;left:10px;z-index:10;
            background:var(--panel-bg);backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.15);border-radius:14px;
            padding:12px 14px;color:var(--text);font-size:0.8rem;
            min-width:280px;max-width:calc(100vw - 20px);
            box-shadow:0 8px 32px rgba(0,0,0,0.5);
        }
        #info-panel h2{font-size:0.95rem;margin-bottom:6px;color:#fff;}
        .stat-row{display:flex;justify-content:space-between;margin:3px 0;}
        .stat-label{color:#aaa;font-size:0.7rem;}
        .stat-value{font-weight:600;color:#fff;font-family:monospace;}
        .bar-container{height:6px;background:rgba(255,255,255,0.1);border-radius:3px;margin-top:6px;overflow:hidden;}
        .bar-fill{height:100%;border-radius:3px;transition:width 1s;background:linear-gradient(90deg,#44cc66,#ff4466);}

        #legend{
            position:fixed;bottom:20px;left:10px;z-index:10;
            background:var(--panel-bg);backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.15);border-radius:12px;
            padding:8px 14px;color:var(--text);font-size:0.7rem;
            box-shadow:0 8px 32px rgba(0,0,0,0.5);
        }
        #legend .gradient-bar{width:150px;height:10px;border-radius:5px;margin:4px 0;background:linear-gradient(90deg,#33cc55,#cccc33,#dd8822,#cc1133);}
        .legend-labels{display:flex;justify-content:space-between;color:#aaa;font-size:0.6rem;}

        #status-badge{
            position:fixed;top:12px;right:10px;z-index:10;
            background:var(--panel-bg);backdrop-filter:blur(16px);
            border:1px solid rgba(255,255,255,0.15);border-radius:24px;
            padding:8px 14px;color:#ccc;font-size:0.75rem;
            box-shadow:0 8px 32px rgba(0,0,0,0.5);
        }
        .indicator{width:8px;height:8px;border-radius:50%;background:#55cc88;display:inline-block;margin-right:6px;animation:pulse 2s infinite;}
        .indicator.warning{background:#ffaa33;animation:pulse-warn 1.5s infinite;}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(85,204,136,0.7)}50%{box-shadow:0 0 0 10px rgba(85,204,136,0)}}
        @keyframes pulse-warn{0%,100%{box-shadow:0 0 0 0 rgba(255,170,51,0.7)}50%{box-shadow:0 0 0 10px rgba(255,170,51,0)}}

        /* 拡大ミニマップ */
        #minimap-container{
            position:fixed;bottom:20px;right:10px;z-index:10;
            width:280px;height:280px;border-radius:12px;overflow:hidden;
            border:2px solid rgba(255,255,255,0.3);
            box-shadow:0 8px 32px rgba(0,0,0,0.6);
        }
        #minimap{width:100%;height:100%;}

        /* フルスクリーンマップ */
        #fullmap-container{
            position:fixed;top:0;left:0;width:100%;height:100%;z-index:20;
            display:none;
        }
        #fullmap{width:100%;height:100%;}
        #close-map-btn{
            position:absolute;top:20px;right:20px;z-index:30;
            background:var(--panel-bg);color:white;border:none;border-radius:50%;
            width:40px;height:40px;font-size:1.5rem;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 4px 16px rgba(0,0,0,0.5);
        }

        @media (max-width:600px){
            #info-panel{font-size:0.7rem;padding:8px 10px;min-width:200px;}
            #legend{bottom:10px;padding:5px 10px;}
            #minimap-container{width:200px;height:200px;bottom:10px;}
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h2>📊 統合リアルタイム人流予測 (安定版)</h2>
        <div class="stat-row"><span class="stat-label">📍 位置</span><span class="stat-value" id="latlon">取得中</span></div>
        <div class="stat-row"><span class="stat-label">🕒 曜日/時間</span><span class="stat-value" id="daytime">--</span></div>
        <div class="stat-row"><span class="stat-label">🌤 天気</span><span class="stat-value" id="weather">--</span></div>
        <div class="stat-row"><span class="stat-label">🌫️ 大気質 (PM2.5)</span><span class="stat-value" id="airquality">--</span></div>
        <div class="stat-row"><span class="stat-label">🚆 鉄道遅延</span><span class="stat-value" id="transport">--</span></div>
        <div class="stat-row"><span class="stat-label">🚦 交通量</span><span class="stat-value" id="traffic">--</span></div>
        <div class="stat-row"><span class="stat-label">🎉 イベント施設</span><span class="stat-value" id="event">--</span></div>
        <div class="stat-row"><span class="stat-label">🏢 周辺施設数</span><span class="stat-value" id="poi">--</span></div>
        <div class="stat-row"><span class="stat-label">📰 ニュース</span><span class="stat-value" id="news">--</span></div>
        <div class="stat-row"><span class="stat-label">🎌 祝日</span><span class="stat-value" id="holiday">--</span></div>
        <div class="stat-row" style="margin-top:4px;border-top:1px solid rgba(255,255,255,0.2);padding-top:4px;">
            <span class="stat-label">📈 統合スコア</span><span class="stat-value" id="score-val">--</span>
        </div>
        <div class="bar-container"><div class="bar-fill" id="density-bar" style="width:0%;"></div></div>
    </div>
    <div id="legend">
        <span style="font-weight:600;">混雑度 (統合スコア)</span>
        <div class="gradient-bar"></div>
        <div class="legend-labels"><span>低</span><span>中</span><span>高</span></div>
    </div>
    <div id="status-badge">
        <span class="indicator" id="status-indicator"></span>
        <span>次回更新 <span id="countdown">10</span>s</span>
    </div>

    <div id="minimap-container">
        <div id="minimap"></div>
    </div>

    <div id="fullmap-container">
        <div id="fullmap"></div>
        <button id="close-map-btn">✕</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ─── 設定 ─────────────────────────────
        const MAIN_UPDATE_INTERVAL = 10000; // 10秒
        const RADIUS_M = 1000;
        const DENSITY_MAX = 100;
        const FALLBACK_GRID_RES = 50;
        const MAX_POINTS = 3000;
        const isMobile = window.innerWidth < 768;

        const GEOAPIFY_KEY = 'e1cb67146472422c8fd045c6af4ab16e';
        const ODPT_API_KEY = 'YOUR_ODPT_API_KEY';

        // 各因子の更新間隔
        const INTERVALS = {
            weather: 10 * 60 * 1000,
            airQuality: 30 * 60 * 1000,
            transport: 60 * 1000,
            traffic: 5 * 60 * 1000,
            event: 30 * 60 * 1000,
            poi: 30 * 60 * 1000,
            news: 60 * 60 * 1000,
            holiday: 12 * 60 * 60 * 1000
        };

        const cache = {
            factors: { day:0.5, weather:0.5, airQuality:0.5, transport:0.1, traffic:0.5, event:0.3, poi:0.5, news:0.4, holiday:0.3 },
            points: [],
            lastFetch: { weather:0, airQuality:0, transport:0, traffic:0, event:0, poi:0, news:0, holiday:0 },
            displayStrings: { weather:'--', airQuality:'--', transport:'--', traffic:'--', event:'--', poi:'--', news:'--', holiday:'--' }
        };

        const container = document.getElementById('canvas-container');
        const elLatLon = document.getElementById('latlon');
        const elDaytime = document.getElementById('daytime');
        const elWeather = document.getElementById('weather');
        const elAirQuality = document.getElementById('airquality');
        const elTransport = document.getElementById('transport');
        const elTraffic = document.getElementById('traffic');
        const elEvent = document.getElementById('event');
        const elPoi = document.getElementById('poi');
        const elNews = document.getElementById('news');
        const elHoliday = document.getElementById('holiday');
        const elScore = document.getElementById('score-val');
        const elDensityBar = document.getElementById('density-bar');
        const elCountdown = document.getElementById('countdown');
        const elStatusIndicator = document.getElementById('status-indicator');

        let currentLat = 35.6812, currentLon = 139.7671;

        // ─── 位置情報 ──────────────────────
        function getPosition() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) return reject(new Error('非対応'));
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true, timeout: 8000, maximumAge: 30000
                });
            });
        }

        // ─── 各因子取得関数 ──────────────
        function getDayTimeFactor() {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            let factor = 0.5;
            if (day >= 1 && day <= 5) {
                if (hour >= 7 && hour <= 9) factor = 0.95;
                else if (hour >= 17 && hour <= 19) factor = 0.9;
                else if (hour >= 10 && hour <= 16) factor = 0.6;
                else if (hour >= 20 && hour <= 23) factor = 0.7;
                else factor = 0.2;
            } else {
                if (hour >= 10 && hour <= 18) factor = 0.85;
                else if (hour >= 19 && hour <= 22) factor = 0.75;
                else factor = 0.35;
            }
            const days = ['日','月','火','水','木','金','土'];
            elDaytime.textContent = `${days[day]}曜 ${hour}時 (${factor.toFixed(2)})`;
            return factor;
        }

        async function fetchWeather(lat, lon) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
                const res = await fetch(url);
                const data = await res.json();
                const code = data.current_weather.weathercode;
                const temp = data.current_weather.temperature;
                let factor = 0.8, desc = '';
                if (code === 0) { factor = 1.0; desc = '快晴'; }
                else if (code <= 3) { factor = 0.9; desc = '曇り'; }
                else if (code <= 48) { factor = 0.7; desc = '霧'; }
                else if (code <= 67) { factor = 0.4; desc = '雨'; }
                else if (code <= 77) { factor = 0.25; desc = '雪'; }
                else { factor = 0.6; desc = '他'; }
                if (temp < 5) factor *= 0.7;
                else if (temp > 35) factor *= 0.8;
                return { factor, text: `${desc} ${temp}℃ (${factor.toFixed(2)})` };
            } catch (e) {
                return { factor: cache.factors.weather, text: '取得失敗' };
            }
        }

        async function fetchAirQuality(lat, lon) {
            try {
                const url = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm2_5`;
                const res = await fetch(url);
                const data = await res.json();
                const pm25 = data.current?.pm2_5 || 10;
                const factor = Math.max(0, 1 - pm25 / 100);
                return { factor, text: `PM2.5 ${pm25}µg/m³ (${factor.toFixed(2)})` };
            } catch (e) {
                return { factor: cache.factors.airQuality, text: '取得失敗' };
            }
        }

        async function fetchTransport(lat, lon) {
            if (ODPT_API_KEY === 'YOUR_ODPT_API_KEY') {
                const now = new Date();
                const hour = now.getHours();
                const day = now.getDay();
                let factor = 0.1;
                if (day >= 1 && day <= 5) {
                    if (hour >= 7 && hour <= 9) factor = 0.6;
                    else if (hour >= 17 && hour <= 19) factor = 0.5;
                    else if (hour >= 10 && hour <= 16) factor = 0.3;
                } else {
                    if (hour >= 10 && hour <= 18) factor = 0.25;
                }
                return { factor, text: `遅延確率 ${(factor*100).toFixed(0)}% (${factor.toFixed(2)})` };
            }
            try {
                const url = `https://api.odpt.org/api/v1/railway/delays?odpt:operator=odpt.Operator:JR-East&acl:consumerKey=${ODPT_API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                const delayCount = Array.isArray(data) ? data.length : 0;
                const factor = Math.min(1, delayCount * 0.1 + 0.1);
                return { factor, text: `${delayCount}路線遅延 (${factor.toFixed(2)})` };
            } catch (e) {
                return { factor: cache.factors.transport, text: '取得失敗' };
            }
        }

        async function fetchTrafficData(lat, lng) {
            const dLat = 1.0 / 111.32;
            const dLon = 1.0 / (111.32 * Math.cos(lat * Math.PI/180));
            const bbox = [lng-dLon, lat-dLat, lng+dLon, lat+dLat].map(v=>v.toFixed(6)).join(',');
            const now = new Date();
            const ft = new Date(now.getTime() - 25*60000);
            const pad = n=>String(n).padStart(2,'0');
            const y=ft.getFullYear(), m=pad(ft.getMonth()+1), d=pad(ft.getDate()), h=pad(ft.getHours()), min=pad(Math.floor(ft.getMinutes()/5)*5);
            const timeCode = `${y}${m}${d}${h}${min}`;
            const timeCodeEnd = `${y}${m}${d}${h}${pad(parseInt(min)+5)}`;
            const url = `https://api.jartic-open-traffic.org/geoserver?service=WFS&version=2.0.0&request=GetFeature&typeNames=t_travospublic_measure_5m&srsName=EPSG:4326&outputFormat=application/json&cql_filter=BBOX(ジオメトリ,${bbox},'EPSG:4326') AND 時間コード>=${timeCode} AND 時間コード<=${timeCodeEnd} AND 道路種別='3'`;
            const res = await fetch(url);
            if (!res.ok) return null;
            const data = await res.json();
            if (!data.features) return [];
            return data.features.map(f=>{
                const p = f.properties;
                const vol = Math.min(parseInt(p['上り・小型交通量']||0) + parseInt(p['下り・小型交通量']||0), DENSITY_MAX);
                return { lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], volume: vol };
            });
        }

        async function fetchEvent(lat, lon) {
            try {
                const categories = 'building.convention_center,entertainment.stadium,entertainment.theatre';
                const url = `https://api.geoapify.com/v2/places?categories=${encodeURIComponent(categories)}&filter=circle:${lon},${lat},1000&limit=50&apiKey=${GEOAPIFY_KEY}`;
                const res = await fetch(url);
                const data = await res.json();
                const count = data.features ? data.features.length : 0;
                const factor = Math.min(1, count * 0.25 + 0.3);
                return { factor, text: `${count}施設 (${factor.toFixed(2)})` };
            } catch (e) {
                return { factor: cache.factors.event, text: 'エラー' };
            }
        }

        async function fetchPoi(lat, lon) {
            try {
                const query = `[out:json];(node[amenity](around:1000,${lat},${lon});way[amenity](around:1000,${lat},${lon}););out count;`;
                const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
                const res = await fetch(url);
                const data = await res.json();
                const count = data.elements ? data.elements.length : 0;
                const factor = Math.min(1, count / 100 * 0.5 + 0.3);
                return { factor, text: `${count}施設 (${factor.toFixed(2)})` };
            } catch (e) {
                return { factor: cache.factors.poi, text: '取得失敗' };
            }
        }

        async function fetchNews() {
            try {
                const url = `https://api.gdeltproject.org/api/v2/doc/doc?query=japan&mode=artlist&format=json&timespan=24h&maxrecords=20`;
                const res = await fetch(url);
                const data = await res.json();
                const articles = data.articles || [];
                const count = articles.length;
                const avgTone = articles.reduce((sum, a) => sum + (a.tone || 0), 0) / (count || 1);
                const factor = Math.min(1, (count * 0.1 + 0.2) * (avgTone > 0 ? 1 : 0.8));
                return { factor, text: `${count}記事 トーン${avgTone.toFixed(1)} (${factor.toFixed(2)})` };
            } catch (e) {
                return { factor: cache.factors.news, text: '取得失敗' };
            }
        }

        async function fetchHoliday() {
            try {
                const today = new Date();
                const dateStr = today.toISOString().split('T')[0];
                const url = `https://holidays-jp.github.io/api/v1/${today.getFullYear()}/date.json`;
                const res = await fetch(url);
                const holidays = await res.json();
                const isHoliday = !!holidays[dateStr];
                const factor = isHoliday ? 0.9 : 0.3;
                return { factor, text: isHoliday ? '祝日' : '平日' };
            } catch (e) {
                return { factor: cache.factors.holiday, text: '取得失敗' };
            }
        }

        async function updateFactor(key, fetchFn, lat, lon, interval) {
            const now = Date.now();
            if (now - cache.lastFetch[key] > interval) {
                let result;
                if (key === 'news' || key === 'holiday') {
                    result = await fetchFn();
                } else {
                    result = await fetchFn(lat, lon);
                }
                cache.factors[key] = result.factor;
                cache.displayStrings[key] = result.text;
                cache.lastFetch[key] = now;
            }
            const elMap = { weather: elWeather, airQuality: elAirQuality, transport: elTransport, traffic: elTraffic, event: elEvent, poi: elPoi, news: elNews, holiday: elHoliday };
            if (elMap[key]) elMap[key].textContent = cache.displayStrings[key];
            return cache.factors[key];
        }

        async function getTrafficPoints(lat, lon) {
            const now = Date.now();
            if (now - cache.lastFetch.traffic > INTERVALS.traffic) {
                const points = await fetchTrafficData(lat, lon);
                if (points !== null) {
                    cache.points = points;
                    cache.lastFetch.traffic = now;
                }
            }
            return cache.points;
        }

        function computeScore(factors) {
            const weights = {
                day: 0.15, weather: 0.15, airQuality: 0.05, transport: 0.2,
                traffic: 0.2, event: 0.05, poi: 0.05, news: 0.1, holiday: 0.05
            };
            let score = 0;
            for (const key in weights) score += (factors[key] || 0.5) * weights[key];
            return Math.min(1, Math.max(0, score));
        }

        // ─── Leafletマップ ────────────────
        let minimap, userMarker, trafficLayer;
        let fullmap, fullUserMarker, fullTrafficLayer;
        function initMinimap() {
            minimap = L.map('minimap', { attributionControl:false, zoomControl:false, dragging:false }).setView([currentLat, currentLon], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(minimap);
            userMarker = L.circleMarker([currentLat, currentLon], { radius:6, color:'red', fillColor:'#f03', fillOpacity:0.8 }).addTo(minimap);
            trafficLayer = L.layerGroup().addTo(minimap);
        }
        function updateMinimap(lat, lon, points) {
            if (!minimap) initMinimap();
            minimap.setView([lat, lon], 14);
            userMarker.setLatLng([lat, lon]);
            trafficLayer.clearLayers();
            points.forEach(p => {
                L.circleMarker([p.lat, p.lon], { radius:4, color:'#3388ff', fillColor:'#3388ff', fillOpacity:0.7 }).bindPopup(`交通量: ${p.volume}台/5分`).addTo(trafficLayer);
            });
            if (fullmap) {
                fullmap.setView([lat, lon], 14);
                fullUserMarker.setLatLng([lat, lon]);
                fullTrafficLayer.clearLayers();
                points.forEach(p => {
                    L.circleMarker([p.lat, p.lon], { radius:4, color:'#3388ff', fillColor:'#3388ff', fillOpacity:0.7 }).bindPopup(`交通量: ${p.volume}台/5分`).addTo(fullTrafficLayer);
                });
            }
        }
        function initFullmap() {
            if (fullmap) return;
            fullmap = L.map('fullmap', { attributionControl:false, zoomControl:true }).setView([currentLat, currentLon], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(fullmap);
            fullUserMarker = L.circleMarker([currentLat, currentLon], { radius:8, color:'red', fillColor:'#f03', fillOpacity:0.9 }).addTo(fullmap);
            fullTrafficLayer = L.layerGroup().addTo(fullmap);
        }
        document.getElementById('close-map-btn').addEventListener('click', ()=>{
            document.getElementById('fullmap-container').style.display = 'none';
        });
        function toggleFullMap() {
            const fullContainer = document.getElementById('fullmap-container');
            if (fullContainer.style.display === 'none' || !fullContainer.style.display) {
                initFullmap();
                updateMinimap(currentLat, currentLon, cache.points);
                fullContainer.style.display = 'block';
                fullmap.invalidateSize();
            } else {
                fullContainer.style.display = 'none';
            }
        }

        // ─── Three.js シーン ──────────────
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a18);
        const camera = new THREE.PerspectiveCamera(isMobile?55:50, container.clientWidth/container.clientHeight, 10, 6000);
        camera.position.set(1100,850,1300);
        const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0,0,0);
        controls.enableDamping=true; controls.dampingFactor=0.15;
        controls.minDistance=150; controls.maxDistance=3500;
        controls.update();

        scene.add(new THREE.AmbientLight(0x334466, 2.5));
        scene.add(new THREE.HemisphereLight(0x8899cc, 0x223344, 2));

        const groundSize = RADIUS_M * 2.4;
        const groundGeo = new THREE.PlaneGeometry(groundSize, groundSize);
        const groundMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.9, metalness:0.1, transparent:true, opacity:0.9});
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI/2;
        ground.position.y = -15;
        scene.add(ground);

        // 非ブロッキングな地図テクスチャ更新
        function loadGroundTextureAsync(lat, lon) {
            const zoom = 14;
            const n = Math.pow(2, zoom);
            const latRad = lat * Math.PI / 180;
            const xTile = (lon + 180) / 360 * n;
            const yTile = (1 - Math.log(Math.tan(latRad) + 1/Math.cos(latRad)) / Math.PI) / 2 * n;
            const tileX = Math.floor(xTile);
            const tileY = Math.floor(yTile);
            const fracX = xTile - tileX;
            const fracY = yTile - tileY;
            const tileUrl = `https://tile.openstreetmap.org/${zoom}/${tileX}/${tileY}.png`;
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.src = tileUrl;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width; canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const texture = new THREE.CanvasTexture(canvas);
                const tileSizeMeters = (156543.03392 * Math.cos(latRad)) / Math.pow(2, zoom) * 256;
                const scale = groundSize / tileSizeMeters;
                texture.repeat.set(scale, scale);
                texture.offset.set(0.5 - fracX * scale, 0.5 - fracY * scale);
                groundMat.map = texture;
                groundMat.needsUpdate = true;
            };
            img.onerror = () => {
                console.warn('地図タイルの読み込みに失敗しました');
            };
        }

        const gridHelper = new THREE.PolarGridHelper(RADIUS_M,32,16,64,0x334466,0x223355);
        gridHelper.position.y=-14; scene.add(gridHelper);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(RADIUS_M,6,16,100),
            new THREE.MeshStandardMaterial({color:0x4488cc, roughness:0.4, metalness:0.6, emissive:0x112233}));
        ring.rotation.x=-Math.PI/2; ring.position.y=-12; scene.add(ring);

        const markerGroup = new THREE.Group();
        markerGroup.add(new THREE.Mesh(new THREE.SphereGeometry(20,32,32),
            new THREE.MeshStandardMaterial({color:0xff4466, roughness:0.2, metalness:0.3, emissive:0x441111})));
        const pulse = new THREE.Mesh(new THREE.TorusGeometry(26,4,16,48),
            new THREE.MeshStandardMaterial({color:0xff6677, roughness:0.3, metalness:0.4, emissive:0x330000, transparent:true, opacity:0.7}));
        pulse.rotation.x=-Math.PI/2; pulse.name='pulseRing'; markerGroup.add(pulse);
        markerGroup.position.set(0,0,0); scene.add(markerGroup);

        // 点群
        const pointGeo = new THREE.BufferGeometry();
        const posArr = new Float32Array(MAX_POINTS * 3);
        const colArr = new Float32Array(MAX_POINTS * 3);
        pointGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
        pointGeo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
        pointGeo.setDrawRange(0,0);

        const spriteTex = (()=>{
            const c=document.createElement('canvas'); c.width=64;c.height=64;
            const ctx=c.getContext('2d'); const g=ctx.createRadialGradient(32,32,0,32,32,32);
            g.addColorStop(0,'rgba(255,255,255,1)');
            g.addColorStop(0.1,'rgba(255,255,255,0.95)');
            g.addColorStop(0.3,'rgba(255,255,255,0.7)');
            g.addColorStop(0.6,'rgba(255,255,255,0.25)');
            g.addColorStop(1,'rgba(255,255,255,0)');
            ctx.fillStyle=g; ctx.fillRect(0,0,64,64);
            return new THREE.CanvasTexture(c);
        })();

        const basePointSize = isMobile ? 28 : 42;
        const pointMat = new THREE.PointsMaterial({
            size: basePointSize,
            map: spriteTex,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            depthTest: true,
            transparent: true,
            opacity: 0.95,
            sizeAttenuation: true
        });
        const pointCloud = new THREE.Points(pointGeo, pointMat);
        scene.add(pointCloud);

        // 初期ダミー点群（球状の雲）を表示して待ち時間を解消
        function generateInitialDummyPoints() {
            const cells = [];
            const half = (FALLBACK_GRID_RES-1)/2;
            const spacing = (RADIUS_M*2)/(FALLBACK_GRID_RES-1);
            for(let r=0; r<FALLBACK_GRID_RES; r++){
                for(let c=0; c<FALLBACK_GRID_RES; c++){
                    const x = (c-half)*spacing, z = (r-half)*spacing;
                    const density = 10 + Math.random() * 20; // 低めのランダム密度
                    cells.push({ relX: x, relZ: z, density });
                }
            }
            return cells;
        }
        function updatePointsFromCells(cells) {
            const count = Math.min(cells.length, MAX_POINTS);
            for(let i=0;i<count;i++){
                const c = cells[i];
                const h = densityToHeight(c.density);
                const col = densityToColor(c.density);
                posArr[i*3]=c.relX; posArr[i*3+1]=h/2; posArr[i*3+2]=c.relZ;
                colArr[i*3]=col.r; colArr[i*3+1]=col.g; colArr[i*3+2]=col.b;
            }
            for(let i=count;i<MAX_POINTS;i++) posArr[i*3+1] = -999;
            pointGeo.attributes.position.needsUpdate = true;
            pointGeo.attributes.color.needsUpdate = true;
            pointGeo.setDrawRange(0, count);
            pointGeo.computeBoundingSphere();
        }
        // 初回即表示
        updatePointsFromCells(generateInitialDummyPoints());

        function densityToColor(d) {
            const t = Math.min(1, d / DENSITY_MAX);
            return new THREE.Color().setHSL((1-t)*0.33, 0.9 + t*0.1, 0.5 + t*0.15);
        }
        function densityToHeight(d) {
            const t = Math.min(1, d / DENSITY_MAX);
            return 8 + Math.pow(t, 1.5) * 300;
        }

        function updatePointsFromReal(points) {
            const count = Math.min(points.length, MAX_POINTS);
            for(let i=0;i<count;i++){
                const p = points[i];
                const dx = (p.lon - currentLon)*111320*Math.cos(currentLat*Math.PI/180);
                const dy = (p.lat - currentLat)*111320;
                const h = densityToHeight(p.volume);
                const col = densityToColor(p.volume);
                posArr[i*3]=dx; posArr[i*3+1]=h/2; posArr[i*3+2]=dy;
                colArr[i*3]=col.r; colArr[i*3+1]=col.g; colArr[i*3+2]=col.b;
            }
            for(let i=count;i<MAX_POINTS;i++) posArr[i*3+1] = -999;
            pointGeo.attributes.position.needsUpdate = true;
            pointGeo.attributes.color.needsUpdate = true;
            pointGeo.setDrawRange(0, count);
            pointGeo.computeBoundingSphere();
        }

        function generateSimGrid(score, transportFactor) {
            const cells = [];
            const half = (FALLBACK_GRID_RES-1)/2;
            const spacing = (RADIUS_M*2)/(FALLBACK_GRID_RES-1);
            const hotspots = [];
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2 + Math.random() * 0.5;
                const dist = 300 + Math.random() * 600;
                hotspots.push({ x: Math.cos(angle) * dist, z: Math.sin(angle) * dist, strength: 0.6 + Math.random() * 0.4 });
            }
            if (transportFactor > 0.4) {
                hotspots.push({ x: 0, z: 0, strength: transportFactor * 0.8 });
            }
            for(let r=0; r<FALLBACK_GRID_RES; r++){
                for(let c=0; c<FALLBACK_GRID_RES; c++){
                    const x = (c-half)*spacing, z = (r-half)*spacing;
                    let density = 0.05 + (score * 0.1);
                    hotspots.forEach(h => {
                        const d = Math.sqrt((x-h.x)**2 + (z-h.z)**2);
                        density += h.strength * Math.exp(-d*d/(2*250*250));
                    });
                    density = Math.min(DENSITY_MAX, density * DENSITY_MAX);
                    cells.push({ relX: x, relZ: z, density });
                }
            }
            return cells;
        }

        // ─── メイン更新（非ブロッキング保証）──
        let countdown = 10;
        async function mainUpdate() {
            // 位置情報
            try {
                const pos = await getPosition();
                currentLat = pos.coords.latitude;
                currentLon = pos.coords.longitude;
            } catch(e) {}
            elLatLon.textContent = `${currentLat.toFixed(5)}, ${currentLon.toFixed(5)}`;

            // 地図テクスチャ（非同期・非ブロッキング）
            loadGroundTextureAsync(currentLat, currentLon);

            // 各因子
            const dayFactor = getDayTimeFactor();
            const [weatherFactor, airFactor, transportFactor, eventFactor, poiFactor, newsFactor, holidayFactor] = await Promise.all([
                updateFactor('weather', fetchWeather, currentLat, currentLon, INTERVALS.weather),
                updateFactor('airQuality', fetchAirQuality, currentLat, currentLon, INTERVALS.airQuality),
                updateFactor('transport', fetchTransport, currentLat, currentLon, INTERVALS.transport),
                updateFactor('event', fetchEvent, currentLat, currentLon, INTERVALS.event),
                updateFactor('poi', fetchPoi, currentLat, currentLon, INTERVALS.poi),
                updateFactor('news', fetchNews, null, null, INTERVALS.news),
                updateFactor('holiday', fetchHoliday, null, null, INTERVALS.holiday)
            ]);

            // 交通量ポイント
            const points = await getTrafficPoints(currentLat, currentLon);
            let trafficFactor;
            if (points && points.length > 0) {
                const avg = points.reduce((s,p)=>s+p.volume,0)/points.length;
                trafficFactor = Math.min(1, avg / DENSITY_MAX);
                cache.displayStrings.traffic = `${points.length}地点 平均${Math.round(avg)}台/5分 (${trafficFactor.toFixed(2)})`;
                cache.factors.traffic = trafficFactor;
            } else {
                trafficFactor = cache.factors.traffic || 0.5;
                if (!cache.displayStrings.traffic) cache.displayStrings.traffic = '観測点なし';
            }
            elTraffic.textContent = cache.displayStrings.traffic;

            // スコア計算
            const factors = {
                day: dayFactor, weather: weatherFactor, airQuality: airFactor,
                transport: transportFactor, traffic: trafficFactor, event: eventFactor,
                poi: poiFactor, news: newsFactor, holiday: holidayFactor
            };
            const score = computeScore(factors);
            elScore.textContent = score.toFixed(2);
            elDensityBar.style.width = (score*100)+'%';

            // 点群更新（必ず実行）
            if (points && points.length > 0) {
                updatePointsFromReal(points);
            } else {
                const simCells = generateSimGrid(score, transportFactor);
                updatePointsFromCells(simCells);
            }

            // ミニマップ更新
            updateMinimap(currentLat, currentLon, points || []);
        }

        // 10秒ループ
        function startMainLoop() {
            mainUpdate().catch(e => console.error('更新エラー:', e)); // エラーをキャッチして止めない
            setInterval(() => {
                mainUpdate().catch(e => console.error('更新エラー:', e));
            }, MAIN_UPDATE_INTERVAL);
            // カウントダウン表示
            setInterval(() => {
                countdown = Math.max(0, countdown - 1);
                if (countdown === 0) countdown = 10;
                elCountdown.textContent = countdown;
            }, 1000);
        }

        // アニメーション
        function animate(ts){
            requestAnimationFrame(animate);
            controls.update();
            const p = markerGroup.getObjectByName('pulseRing');
            if(p){ const s=1+Math.sin(ts*0.003)*0.4; p.scale.setScalar(s); p.material.opacity=0.3+Math.sin(ts*0.003)*0.3; }
            markerGroup.position.y = Math.sin(ts*0.002)*6;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', ()=>{
            camera.aspect = container.clientWidth/container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            pointMat.size = container.clientWidth < 400 ? 22 : container.clientWidth < 600 ? 28 : 42;
        });

        window.addEventListener('keydown', e=>{
            if(e.key==='r'){ camera.position.set(1100,850,1300); controls.target.set(0,0,0); controls.update(); }
            else if(e.key==='t'){ camera.position.set(0,1800,0); controls.target.set(0,0,0); controls.update(); }
            else if(e.key==='f'){ mainUpdate().catch(e=>console.error(e)); countdown=10; elCountdown.textContent='10'; }
            else if(e.key==='m'){ toggleFullMap(); }
        });

        console.log('🚀 統合リアルタイム人流予測 (安定版)');
        startMainLoop();
        requestAnimationFrame(animate);
    </script>
</body>
