<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MIL-POP-3D // Terminal</title>
  <!-- Mapbox GL JS -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <!-- deck.gl -->
  <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
  <!-- deck.gl Mapbox overlay -->
  <script src="https://unpkg.com/@deck.gl/mapbox@latest/dist.min.js"></script>
  <!-- geotiff.js -->
  <script src="https://unpkg.com/geotiff@latest/dist-browser/geotiff.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:monospace; }

    /* ---- CLI起動画面 ---- */
    #boot-screen {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:#000; color:#0f0; display:flex; flex-direction:column;
      justify-content:center; align-items:center; z-index:9999;
      white-space:pre-wrap; line-height:1.5; font-size:14px;
      transition: opacity 1.5s ease-in-out;
    }
    .boot-line { opacity:0; }
    .boot-line.visible { opacity:1; }
    #boot-cursor {
      display:inline-block; width:8px; height:16px; background:#0f0;
      animation: blink 0.8s infinite; margin-left:2px;
    }
    @keyframes blink { 0%,100%{ opacity:1 } 50%{ opacity:0 } }

    /* ---- メインマップ画面 ---- */
    #map-container {
      position:fixed; top:0; left:0; width:100%; height:100%; display:none;
    }
    #map { width:100%; height:100%; }

    /* ---- HUD ---- */
    .hud {
      position:fixed; z-index:10; pointer-events:none;
      color:#0f0; font-size:12px; background:rgba(0,0,0,0.7);
      border:1px solid #0f0; border-radius:4px; padding:8px 12px;
      text-shadow:0 0 5px #0f0; letter-spacing:1px;
    }
    #hud-coords { bottom:20px; left:20px; }
    #hud-alt { bottom:20px; right:20px; text-align:right; }
    #hud-compass { top:20px; left:20px; }
    #hud-status { top:20px; right:20px; text-align:right; }
  </style>
</head>
<body>
  <!-- 起動画面 -->
  <div id="boot-screen">
    <div id="boot-text"></div>
  </div>

  <!-- メインマップ＋HUD -->
  <div id="map-container">
    <div id="map"></div>
    <div class="hud" id="hud-coords">COORD: --.----° --.----°</div>
    <div class="hud" id="hud-alt">ALT: ----m</div>
    <div class="hud" id="hud-compass">HDG: ---°</div>
    <div class="hud" id="hud-status">STATUS: INIT</div>
  </div>

  <script>
    // ==================== 設定 ====================
    const MAPBOX_TOKEN = 'YOUR_MAPBOX_ACCESS_TOKEN'; // ★ ここを変更 ★
    const POP_COG_URL = 'https://worldpop-cog.s3.amazonaws.com/pop/2020/UNadj/global_ppp_2020_1km_UNadj.tif';
    const UPDATE_INTERVAL_MS = 30000;    // 30秒間隔
    const GRID_SIZE = 20;                // 点群の一辺の数 (20x20 = 400本)
    const WINDOW_DEG = 0.18;            // 約20km四方 (1kmメッシュの窓)

    // ==================== CLI起動シーケンス ====================
    const bootLines = [
      "INITIALIZING SYSTEM...",
      "CHECKING SECURITY CLEARANCE... [OK]",
      "LOADING GEOSPATIAL ENGINE... [v3.2.4]",
      "CONNECTING TO WORLD POPULATION DATABASE...",
      "SATELLITE LINK ESTABLISHED [LATENCY: 23ms]",
      "RENDERING POINT CLOUD MODULE... [OK]",
      "SYSTEM READY. LAUNCHING INTERFACE...",
      ">_"
    ];

    let bootContainer = document.getElementById('boot-text');
    function bootSequence() {
      let lineIndex = 0;
      let charIndex = 0;
      let currentLineDiv = null;

      function typeNext() {
        if (lineIndex >= bootLines.length) {
          // シーケンス完了 → マップ起動へ
          setTimeout(() => {
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => {
              document.getElementById('boot-screen').style.display = 'none';
              document.getElementById('map-container').style.display = 'block';
              initMapApp();
            }, 1500);
          }, 800);
          return;
        }

        if (charIndex === 0) {
          currentLineDiv = document.createElement('div');
          currentLineDiv.className = 'boot-line visible';
          bootContainer.appendChild(currentLineDiv);
        }

        const line = bootLines[lineIndex];
        if (charIndex < line.length) {
          currentLineDiv.textContent += line[charIndex];
          charIndex++;
          // タイプ速度をランダムに (40～100ms)
          const speed = 40 + Math.floor(Math.random() * 60);
          setTimeout(typeNext, speed);
        } else {
          // 行末にカーソル点滅を一時表示 → 次の行へ
          lineIndex++;
          charIndex = 0;
          setTimeout(typeNext, 300);
        }
      }
      typeNext();
    }
    bootSequence();

    // ==================== メインアプリ ====================
    let map, deckOverlay, columnLayer;
    let currentLat, currentLng, currentAltitude;

    function initMapApp() {
      mapboxgl.accessToken = MAPBOX_TOKEN;

      // 地図の初期化（3D地形オン）
      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/dark-v11',   // 暗色マップ
        center: [139.6917, 35.6895],                // 東京（仮）
        zoom: 13,
        pitch: 60,
        bearing: 0,
        antialias: true
      });

      map.addControl(new mapboxgl.NavigationControl(), 'top-left');

      map.on('style.load', () => {
        // 3D地形を有効化
        map.addSource('mapbox-dem', {
          type: 'raster-dem',
          url: 'mapbox://mapbox.mapbox-terrain-dem-v1',
          tileSize: 512,
          maxzoom: 14
        });
        map.setTerrain({ source: 'mapbox-dem', exaggeration: 1.5 });

        // deck.gl オーバーレイを作成
        deckOverlay = new deck.MapboxOverlay({
          interleaved: true
        });
        map.addControl(deckOverlay);

        // GPS追跡開始
        startLocationTracking();
      });

      // 地図の方位変化をHUDに反映
      map.on('rotate', () => {
        const bearing = map.getBearing().toFixed(0);
        document.getElementById('hud-compass').textContent = `HDG: ${bearing.padStart(3,'0')}°`;
      });
    }

    // ---- GPS位置情報の追跡 ----
    function startLocationTracking() {
      if (!navigator.geolocation) {
        updateStatus("GPS UNAVAILABLE");
        return;
      }

      const options = {
        enableHighAccuracy: true,
        maximumAge: 10000,        // 10秒以内のキャッシュ
        timeout: 15000
      };

      function success(pos) {
        currentLat = pos.coords.latitude;
        currentLng = pos.coords.longitude;
        currentAltitude = pos.coords.altitude || 0;

        // HUD更新
        document.getElementById('hud-coords').textContent =
          `COORD: ${currentLat.toFixed(4)}° ${currentLng.toFixed(4)}°`;
        document.getElementById('hud-alt').textContent =
          `ALT: ${Math.round(currentAltitude)}m`;

        // 地図中心を更新
        map.easeTo({
          center: [currentLng, currentLat],
          zoom: 13,
          duration: 2000
        });

        // 人口密度データを読み込み、点群を更新
        loadPopulationPointCloud(currentLat, currentLng);
        updateStatus("LIVE");

        // 次回更新タイミングを表示
        updateStatus(`LIVE (next in ${UPDATE_INTERVAL_MS/1000}s)`);
      }

      function error(err) {
        updateStatus("GPS ERROR: " + err.message);
      }

      // 初回実行＆30秒間隔で再取得
      navigator.geolocation.getCurrentPosition(success, error, options);
      setInterval(() => {
        navigator.geolocation.getCurrentPosition(success, error, options);
      }, UPDATE_INTERVAL_MS);
    }

    // ---- GeoTIFFから人口データを取得し点群レイヤーを構築 ----
    async function loadPopulationPointCloud(lat, lng) {
      updateStatus("LOADING POP DATA...");
      try {
        const half = WINDOW_DEG / 2;
        const bbox = [lng - half, lat - half, lng + half, lat + half]; // [minX, minY, maxX, maxY]

        // COGを開く
        const tiff = await GeoTIFF.fromUrl(POP_COG_URL);
        const image = await tiff.getImage();
        const raster = await image.readRasters({ bbox });

        // データは1バンド、Float32
        const data = raster[0];  // 1次元配列（行優先）
        const width = image.getWidth();
        const height = image.getHeight();

        // グリッド点の生成
        const columns = [];
        const stepLng = WINDOW_DEG / GRID_SIZE;
        const stepLat = WINDOW_DEG / GRID_SIZE;
        const startLng = lng - half;
        const startLat = lat - half;

        let maxPop = 0;
        const cells = [];

        // まず値を集める（将来スケーリングに使う）
        for (let row = 0; row < GRID_SIZE; row++) {
          for (let col = 0; col < GRID_SIZE; col++) {
            const lngPos = startLng + (col + 0.5) * stepLng;
            const latPos = startLat + (row + 0.5) * stepLat;
            // GeoTIFF内でのピクセル座標をbboxから逆算
            const pixelX = Math.floor((col + 0.5) * (width / GRID_SIZE));
            const pixelY = Math.floor((row + 0.5) * (height / GRID_SIZE));
            const idx = pixelY * width + pixelX;
            const pop = data[idx] || 0;
            if (pop > maxPop) maxPop = pop;
            cells.push({ lng: lngPos, lat: latPos, pop });
          }
        }

        // スケーリング: 高さは最大200m、人口0→0m、maxPop→200m
        const maxHeight = 200;
        cells.forEach(cell => {
          const height = (maxPop > 0) ? (cell.pop / maxPop) * maxHeight : 0;
          columns.push({
            position: [cell.lng, cell.lat],
            elevation: height,
            population: cell.pop,
            color: getColorByPop(cell.pop, maxPop)
          });
        });

        // ColumnLayer を更新
        const newLayer = new deck.ColumnLayer({
          id: 'pop-columns',
          data: columns,
          diskResolution: 6,
          radius: 80,              // 柱の半径（メートル）
          extruded: true,
          getPosition: d => d.position,
          getElevation: d => d.elevation,
          getFillColor: d => d.color,
          getLineColor: [0, 0, 0, 100],
          lineWidthMinPixels: 1,
          pickable: true,
          onHover: ({object}) => {
            if (object) {
              updateStatus(`POP: ${Math.round(object.population)}`);
            } else {
              updateStatus("LIVE");
            }
          }
        });

        if (deckOverlay) {
          deckOverlay.setProps({ layers: [newLayer] });
        }
        updateStatus("LIVE");
      } catch (err) {
        updateStatus("DATA ERROR: " + err.message);
        console.error(err);
      }
    }

    // 人口密度→色（緑→黄→赤）
    function getColorByPop(pop, max) {
      if (max === 0) return [0,255,0];
      const t = Math.min(pop / max, 1.0);
      if (t < 0.5) {
        // 緑 → 黄
        const r = Math.floor(255 * (t * 2));
        return [r, 255, 0];
      } else {
        // 黄 → 赤
        const g = Math.floor(255 * (1 - (t - 0.5) * 2));
        return [255, g, 0];
      }
    }

    function updateStatus(msg) {
      document.getElementById('hud-status').textContent = `STATUS: ${msg}`;
    }

    // ==================== コンパス HUD の初期表示 ====================
    document.addEventListener('DOMContentLoaded', () => {
      // 起動中は非表示だが後で表示される
    });
  </script>
</body>
</html>
